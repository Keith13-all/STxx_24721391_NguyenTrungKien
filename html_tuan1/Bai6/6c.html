<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Date Form</title>
    <style>
        .form-c-container {
            border: 1px solid #66b3ff;
            width: 250px;
            padding: 15px;
            font-family: 'Times New Roman', Times, serif;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input[type="text"], .form-group input[type="date"] {
            width: 80%;
            border: 1px solid #ccc;
            padding: 3px;
        }
        .color-picker {
            width: 50px;
            height: 25px;
            padding: 0;
            border: 1px solid #999;
        }
        .submit-btn {
            display: block;
            margin: 20px auto 0;
            padding: 3px 15px;
        }
    </style>
</head>
<body>

<div class="form-c-container">
    <form>
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name">
        </div>
        
        <div class="form-group">
            <label>Telephone Number:</label>
            <input type="text" name="phone">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" name="email">
        </div>

        <div class="form-group">
            <label>Favorite Color:</label>
            <input type="color" value="#0000ff" class="color-picker">
        </div>

        <div class="form-group">
            <label>Date of Birth:</label>
            <!-- Sử dụng thẻ input type="date" mặc định của HTML5 để hiện bảng chọn ngày (Giao diện bảng chọn có thể thay đổi tùy thuộc vào trình duyệt người dùng) -->
            <input type="date" value="2015-07-16">
        </div>

        <button type="button" class="submit-btn">Submit</button>
    </form>
</div>

</body>
</html>
